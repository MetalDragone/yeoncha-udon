:root{
  /* 레이아웃: 가운데 정렬한 검은 머리띠(로고, 날짜, 투표 버튼), 그 아래 탑승권, 타임라인 일정, 우동 도장 판. 본문 폭 680px */
  --black:#000;
  --mint:#08B191;        /* 에어서울 민트 */
  --mint-deep:#067562;
  --mint-wash:#E3F5F0;
  --red:#E3122C;         /* 로고의 行 도장, 연차 */
  --ink:#141A19;
  --sub:#5A6663;
  --bg:#F3F6F5;
  --paper:#FFF;
  --rule:#DCE3E1;
  --on-mint:#04261F;    /* 민트 위 글자: 흰색은 대비 2.7:1이라 짙은 초록으로 */
  --mint-line:#BFE6DC;   /* 민트 점선, 약도 기본선 */
  --red-wash:#FDE8EA;
  --red-deep:#9A0C1E;
  --star:#9A6416;        /* 평점 별, 흰 바탕 대비 5.6:1 */
  --mute:#9FB0AC;        /* 검은 바탕 위 보조 글자, 원 테두리 */
  --line-strong:#B9C6C3;
  --rule-soft:#E8EEEC;
  --paper-tint:#F8FBFA;
  /* 글자 크기: 10단계만 써요 */
  --t-xs:12.5px;--t-s:13.5px;--t-m:14.5px;--t-ms:15.5px;--t-b:16.5px;--t-l:18px;--t-xl:20px;--t-2x:22px;--t-3x:24px;--t-4x:30px;
  /* 모서리: 칩 6, 작은 칸 10, 칸 12, 카드 18 */
  --r-xs:6px;--r-s:10px;--r-m:12px;--r-l:18px;
  --font:"Pretendard Sub","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t-b);line-height:1.65;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,p{margin:0}
h2,h3{text-wrap:balance}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--mint-deep);outline-offset:3px}
.top :focus-visible{outline-color:#fff}
.col{max-width:680px;margin:0 auto;padding:0 18px}

/* 머리띠 */
.top{background:var(--black);color:#fff;padding:26px 0 44px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:14px;text-align:left}
.brand svg{width:64px;height:64px;flex:none;animation:pop .8s cubic-bezier(.2,1.5,.4,1) .25s both}
.bubble{position:relative;background:#fff;color:var(--ink);border-radius:var(--r-l);padding:8px 14px 9px;line-height:1.3}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:#fff}
.bubble b{display:block;font-size:var(--t-xs);font-weight:800;color:var(--mint-deep)}
.bubble span{display:block;font-size:var(--t-b);font-weight:800;letter-spacing:-.03em}
.logo{display:block;width:min(100%,412px);height:auto;margin:16px auto 0;animation:pop .8s cubic-bezier(.2,1.5,.4,1) both;transform-origin:50% 60%}
.what{margin-top:10px;font-size:var(--t-l);font-weight:500;color:#D9E2E0;max-width:23em;margin-left:auto;margin-right:auto}
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:22px auto 0;max-width:460px}
.week div{border-radius:var(--r-m);padding:8px 2px 9px;text-align:center;border:1.5px solid rgba(255,255,255,.22);line-height:1.25;color:var(--mute)}
.week b{display:block;font-size:var(--t-2x);font-weight:800;color:#fff}
.week span{display:block;font-size:var(--t-xs);font-weight:600}
.week em{display:block;font-style:normal;font-size:var(--t-xs);font-weight:800;margin-top:3px}
.week .go{background:var(--mint);border-color:var(--mint);color:var(--on-mint)}
.week .go b{color:var(--black)}
.week .off{background:#fff;border-color:#fff;color:var(--sub)}
.week .off b{color:var(--ink)}
.week .off em{color:var(--red);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
.week .off.late em{animation-delay:.15s}
.week .dim{color:#8E9C99;border-color:rgba(255,255,255,.14)}
.week .dim b{color:#A7B3B0}

main.col{display:flex;flex-direction:column;gap:44px;margin-top:36px;padding-bottom:64px}
section{display:flex;flex-direction:column;gap:14px;scroll-margin-top:70px}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
section>h2{font-size:var(--t-3x);font-weight:800;letter-spacing:-.03em}
.lede{color:var(--sub)}
.card{background:var(--paper);border-radius:var(--r-l);border:1px solid var(--rule)}
.small{font-size:var(--t-m);color:var(--sub);line-height:1.6}

/* 탑승권 */
.passes{display:grid;gap:14px}
.pass{overflow:hidden;border:0;box-shadow:0 14px 34px rgba(6,117,98,.16)}
.pass-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 18px;background:var(--mint);color:#fff;font-size:var(--t-m);font-weight:600}
.pass-head b{font-size:var(--t-xl);font-weight:800;letter-spacing:-.02em}
.pass.b .pass-head{background:var(--ink)}
.leg{padding:16px 18px 14px}
.leg+.leg{border-top:1.5px dashed var(--rule)}
.leg-date{font-size:var(--t-m);font-weight:700;color:var(--mint-deep)}
.leg-date span{color:var(--sub);font-weight:600;margin-left:6px}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-top:6px}
.port b{display:block;font-size:clamp(30px,9.5vw,40px);font-weight:800;line-height:1;letter-spacing:-.03em}
.port span{display:block;font-size:var(--t-m);color:var(--sub);margin-top:6px}
.port time{display:block;font-size:var(--t-xl);font-weight:700;margin-top:2px}
.port.end{text-align:right}
.air{position:relative;text-align:center;font-size:var(--t-s);color:var(--sub);padding-top:24px;min-height:44px}
.air::before{content:"";position:absolute;left:0;right:0;top:11px;border-top:2px dashed var(--mint-line)}
.plane{position:absolute;top:1px;left:0;width:22px;height:22px;animation:fly 2.6s cubic-bezier(.45,0,.3,1) .4s both}
.leg+.leg .plane{animation-delay:1.6s}
.fare{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:14px 18px 16px;background:var(--mint-wash);position:relative}
.fare::before,.fare::after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.fare::before{left:-11px}.fare::after{right:-11px}
.fare span{font-size:var(--t-m);color:var(--sub);line-height:1.5}
.fare strong{font-size:var(--t-4x);font-weight:800;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.fare strong small{font-size:var(--t-ms);font-weight:700;margin-left:2px}

/* 하루 일정 */
.day{overflow:hidden}
.day-head{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--rule)}
.date{flex:none;width:54px;height:54px;border-radius:var(--r-m);background:var(--mint-wash);color:var(--mint-deep);display:grid;place-content:center;text-align:center;line-height:1.1}
.date b{font-size:var(--t-2x);font-weight:800}
.date span{font-size:var(--t-xs);font-weight:700}
.day.tour .date{background:var(--mint);color:var(--on-mint)}
.day-head h3{font-size:var(--t-xl);font-weight:800;letter-spacing:-.03em}
.day-head p{font-size:var(--t-m);color:var(--sub)}
.rows{list-style:none;margin:0;padding:10px 18px 12px}
.rows li{display:grid;grid-template-columns:3.3em 1fr;gap:8px}
.rows li>div{position:relative;padding:8px 0 16px 18px;border-left:2px solid var(--rule)}
.rows li:last-child>div{border-left-color:transparent;padding-bottom:6px}
.rows li>div::before{content:"";position:absolute;left:-7px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--mute)}
.rows li.eat>div::before{background:var(--red);border-color:var(--red)}
.rows time{font-weight:700;font-size:var(--t-ms);padding-top:8px}
.rows strong{font-weight:700;font-size:var(--t-b);line-height:1.4}
.rows p{font-size:var(--t-ms);color:var(--sub);line-height:1.6;margin-top:3px}
.bowl{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:var(--r-xs);border:1.5px solid var(--red);color:var(--red);font-size:var(--t-xs);font-weight:800;vertical-align:2px;white-space:nowrap;transform:rotate(-3deg)}
.maplink{display:inline-block;margin-top:2px;padding:7px 0 3px;font-size:var(--t-m);font-weight:700;color:var(--mint-deep);text-decoration:none;border-bottom:1.5px solid currentColor;line-height:1.3}
.free{margin:0 18px 16px;padding:12px 14px;border-radius:var(--r-m);background:var(--mint-wash);font-size:var(--t-ms);line-height:1.6}
.free b{font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px 6px}
.split div{border-radius:var(--r-m);background:var(--bg);padding:10px 12px}
.split b{display:block;font-size:var(--t-ms);font-weight:800}
.split span{display:block;font-size:var(--t-m);color:var(--sub);line-height:1.55}

/* 코스 약도 */
.course{margin:0 18px 16px;border:1px solid var(--rule);border-radius:var(--r-m);overflow:hidden}
.course>svg{display:block;width:100%;height:auto;background:var(--paper-tint)}
.course .lbl{font-family:var(--font);font-size:25px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--paper-tint);stroke-width:6px;stroke-linejoin:round}
.course .lbl.dim{font-size:var(--t-xl);font-weight:600;fill:var(--sub)}
.course .lbl.sea{font-size:var(--t-2x);fill:var(--mint-deep);font-weight:600}
.route-line{fill:none;stroke:var(--mint);stroke-width:5;stroke-linecap:round;stroke-dasharray:1 11;animation:flow 1s linear 5}
.route-base{fill:none;stroke:var(--mint-line);stroke-width:5;stroke-linecap:round}
.ring{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out 3 both}
.course-foot{display:flex;flex-direction:column;gap:10px;padding:14px;border-top:1px solid var(--rule)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:800;font-size:var(--t-l);background:var(--mint);color:var(--on-mint);border-radius:var(--r-m);padding:14px 16px;min-height:52px}
.btn svg{width:20px;height:20px;flex:none}
.btnwrap{padding:0 18px 16px}

/* 머리띠 아래: 요약과 버튼 */
.facts{display:grid;grid-template-columns:repeat(3,1fr);max-width:460px;margin:18px auto 0;font-size:var(--t-m);font-weight:700;color:#fff;line-height:1.35}
.facts span{padding:2px 6px;text-wrap:balance}
.facts span+span{border-left:1px solid rgba(255,255,255,.22)}
.cta{display:flex;justify-content:center;gap:10px;margin-top:22px}
.cta a{flex:0 1 190px;text-align:center;text-decoration:none;font-weight:800;font-size:var(--t-l);border-radius:999px;padding:13px 18px}
.cta .go{background:var(--mint);color:var(--on-mint)}
.cta .ghost{border:1.5px solid rgba(255,255,255,.4);color:#fff}

/* 아래 고정 투표 버튼 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--rule);transition:transform .25s ease}
.dock.hide{transform:translateY(110%)}
.dock .in{max-width:644px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dock p{font-size:var(--t-m);color:var(--sub);line-height:1.35}
.dock p b{display:block;font-size:var(--t-l);color:var(--ink)}
.dock a{flex:none;text-decoration:none;background:var(--black);color:#fff;font-weight:800;font-size:var(--t-b);border-radius:999px;padding:12px 22px}
body.has-dock main.col{padding-bottom:110px}

/* 우동 스탬프 */
.rows .dishname{color:var(--ink)!important;font-size:var(--t-m)}
.rows .dishname b{color:var(--red)}
.udons{list-style:none;margin:0;padding:6px 18px}
.udons li{display:grid;grid-template-columns:132px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule);align-items:start}
.udons li:last-child{border-bottom:0}
.dish{margin:0;position:relative}
.dish img{display:block;width:132px;height:108px;object-fit:cover;border-radius:var(--r-m);background:var(--bg)}
.dish figcaption{font-size:var(--t-xs);color:var(--sub);line-height:1.35;margin-top:4px}
.dish figcaption a{color:inherit}
.seal.mini{position:absolute;top:-8px;left:-8px;width:36px;height:36px;border-width:2.5px;background:var(--paper)}
.seal.mini::after{inset:2px}
.seal.mini b{font-size:var(--t-b)}
.ud h3{font-size:var(--t-l);font-weight:800;margin-top:2px}
.ud h3 a{text-decoration:none;border-bottom:1px solid var(--rule);display:inline-block;padding:4px 0 1px}
.ud .when{font-size:var(--t-s);font-weight:800;color:var(--mint-deep)}
.ud .menu{font-size:var(--t-m);color:var(--sub);line-height:1.55;margin-top:6px}
.ud .menu b{display:inline-block;color:var(--red);font-weight:800;margin-right:6px}
.ud small{display:block;font-size:var(--t-s);color:var(--sub);margin-top:6px}
.thumb{float:right;width:58px;height:58px;border-radius:var(--r-s);object-fit:cover;margin:2px 0 6px 10px;background:var(--bg)}
.stamps{list-style:none;margin:0;padding:20px 10px 10px;display:flex;flex-wrap:wrap;justify-content:center;row-gap:20px}
.stamps li{text-align:center;flex:0 0 50%;padding:0 6px}
@media (min-width:600px){.stamps li{flex-basis:25%}}
.stamps a{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none}
.seal{width:92px;height:92px;border-radius:50%;border:3px solid var(--red);color:var(--red);display:grid;place-content:center;line-height:1.1;transform:rotate(var(--r,-4deg));position:relative}
.seal::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px dashed rgba(227,18,44,.45)}
.seal b{font-size:var(--t-4x);font-weight:900;letter-spacing:-.04em}
.seal span{font-size:var(--t-s);font-weight:800}
.stamps strong{font-size:var(--t-ms);font-weight:800;line-height:1.35}
.stamps small{display:block;font-size:var(--t-s);color:var(--sub);line-height:1.45;margin-top:-4px}

/* 혈당 팁 */
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0 22px;padding:4px 18px 8px}
.tips div{padding:13px 0 13px 14px;border-bottom:1px solid var(--rule);position:relative}
.tips div::before{content:"";position:absolute;left:0;top:19px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.tips b{display:block;font-size:var(--t-b);font-weight:800}
.tips span{display:block;font-size:var(--t-m);color:var(--sub);line-height:1.55;margin-top:2px}

/* 챙길 것 체크리스트 */
.pack{list-style:none;margin:0;padding:4px 18px}
.pack li{border-bottom:1px solid var(--rule)}
.pack li:last-child{border-bottom:0}
.pack label{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:13px 0;cursor:pointer}
.pack input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--mint)}
.pack b{font-weight:700}
.pack small{display:block;font-size:var(--t-m);color:var(--sub)}
.pack input:checked+span b{text-decoration:line-through;color:var(--sub)}

/* 본문 건너뛰기 */
.skip{position:absolute;left:12px;top:-60px;z-index:9;background:var(--paper);color:var(--ink);font-weight:800;padding:10px 14px;border-radius:var(--r-s);text-decoration:none}
.skip:focus{top:12px}

/* 섹션 바로가기 */
.toc{position:sticky;top:0;z-index:4;background:rgba(240,244,243,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.toc .col{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;scrollbar-width:none}
.toc .col::-webkit-scrollbar{display:none}
.toc a{flex:none;text-decoration:none;font-size:var(--t-m);font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:9px 14px}
.toc a.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 같이 가는 사람 */
.crew{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mate{display:flex;align-items:center;gap:14px;padding:16px 18px;position:relative;overflow:hidden;min-height:96px}
.mate .med{width:58px;height:58px;flex:none;transform-origin:50% 100%}
.mate .med svg{width:100%;height:100%;display:block}
.mate p{flex:1;min-width:0;padding-right:44px}
.mate p b{display:block;font-size:var(--t-l);font-weight:800;line-height:1.4;white-space:nowrap}
.mark{position:absolute;right:12px;top:12px;border:3px solid var(--red);color:var(--red);border-radius:var(--r-s);padding:3px 10px;font-size:var(--t-l);font-weight:900;transform:rotate(-10deg);opacity:0}
.crew.go .med{animation:press .9s cubic-bezier(.3,.7,.3,1) both;animation-delay:calc(var(--i)*.55s)}
.crew.go .mark{animation:inked .35s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(var(--i)*.55s + .42s)}
@keyframes press{0%{transform:translateY(-22px) rotate(-12deg)}35%{transform:translateY(-26px) rotate(-14deg)}55%{transform:translateY(4px) scaleY(.86) rotate(0)}70%{transform:translateY(0) scaleY(1.04)}100%{transform:none}}
@keyframes inked{0%{opacity:0;transform:scale(2) rotate(-24deg)}100%{opacity:1;transform:rotate(-10deg)}}

.crew.done .mark{opacity:1}
@media (prefers-reduced-motion:reduce){.mark{opacity:1!important;transform:rotate(-10deg)!important}}

/* 확정 도장 */
.ok-stamp{display:inline-block;border:2.5px solid #fff;border-radius:var(--r-xs);padding:1px 9px;font-size:var(--t-ms);font-weight:900;transform:rotate(-4deg)}

/* 표 형태 목록: 왼쪽 이름, 오른쪽 값 */
.kv{list-style:none;margin:0;padding:4px 18px}
.kv span>a{display:inline-block;padding:3px 0 1px}
.kv li{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--rule)}
.kv li:last-child{border-bottom:0}
.kv span small{display:block;font-size:var(--t-m);color:var(--sub);line-height:1.55;margin-top:2px}
.kv b{font-weight:800;white-space:nowrap;text-align:right}
.kv b small{display:block;font-size:var(--t-s);font-weight:600;color:var(--sub)}

/* 순서가 있는 단계 */
.steps{list-style:none;margin:0;padding:6px 18px 10px;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:12px 0 12px 40px;border-bottom:1px solid var(--rule)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(st);position:absolute;left:0;top:12px;width:27px;height:27px;border-radius:50%;background:var(--mint);color:var(--on-mint);font-weight:800;font-size:var(--t-m);display:grid;place-items:center}
.steps b{display:block;font-size:var(--t-b);font-weight:800}
.steps span{display:block;font-size:var(--t-m);color:var(--sub);line-height:1.6;margin-top:2px}

/* 숙소 */
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.area{padding:16px 18px}
.area h3{font-size:var(--t-l);font-weight:800}
.area p{font-size:var(--t-m);color:var(--sub);line-height:1.6;margin-top:4px}
.area .for{display:inline-block;margin-top:8px;font-size:var(--t-s);font-weight:800;color:var(--mint-deep)}
.hotels{list-style:none;margin:0;padding:2px 18px}
.hotels li{padding:14px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr;gap:2px 12px}
.hotels li:last-child{border-bottom:0}
.hotels a{justify-self:start;font-weight:800;font-size:var(--t-b);text-decoration:none;border-bottom:1px solid var(--rule)}
.hotel{overflow:hidden}
.hphoto{margin:0}
.hphoto img{display:block;width:100%;height:190px;object-fit:cover;background:var(--bg)}
.hphoto figcaption{font-size:var(--t-xs);color:var(--sub);padding:5px 18px 0}
.hphoto figcaption a{color:inherit}
.hphoto.none{height:120px;background:repeating-linear-gradient(135deg,var(--bg) 0 14px,var(--rule-soft) 14px 28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.hphoto.none span{font-size:var(--t-xs);color:var(--sub)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink)}
.hbody{padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.htop h3{font-size:var(--t-l);font-weight:800;line-height:1.35}
.score{flex:none;text-align:right;font-weight:800;font-size:var(--t-b);color:var(--star)}
.score small{display:block;font-size:var(--t-xs);font-weight:600;color:var(--sub)}
.hotel .where{font-size:var(--t-s);font-weight:700;color:var(--mint-deep)}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{font-size:var(--t-xs);font-weight:700;background:var(--mint-wash);color:var(--mint-deep);border-radius:999px;padding:4px 10px}
.pc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pc b{display:block;font-size:var(--t-s);font-weight:800;color:var(--mint-deep);margin-bottom:2px}
.pc .con b{color:var(--red)}
.pc ul{margin:0;padding-left:18px;font-size:var(--t-m);color:var(--ink);line-height:1.6}
.rv{font-size:var(--t-m);color:var(--sub);line-height:1.6;background:var(--bg);border-radius:var(--r-s);padding:9px 12px}
.rv b{display:block;font-size:var(--t-xs);color:var(--ink);font-weight:800}
.hlinks{display:flex;gap:14px;font-size:var(--t-m);font-weight:700}
.nights{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.nights div{background:var(--bg);border-radius:var(--r-s);padding:7px 8px;text-align:center}
.nights span{display:block;font-size:var(--t-xs);font-weight:700;color:var(--sub)}
.nights b{display:block;font-size:var(--t-m);font-weight:800;letter-spacing:-.02em}
.nights .sum{background:var(--ink);color:#fff}
.nights .sum span{color:var(--line-strong)}
.nights .sum.low{background:var(--mint);color:var(--on-mint)}
.nights .sum.low span{color:var(--on-mint)}
.hotels .where{grid-column:1 / -1;font-size:var(--t-s);font-weight:700;color:var(--mint-deep)}
.hotels p{grid-column:1 / -1;font-size:var(--t-m);color:var(--sub);line-height:1.55}

/* 숙소 한눈에 비교 */
.cmp{padding:6px 0 4px}
.cmp-h{display:grid;grid-template-columns:1fr 46px 9.5em;gap:10px;padding:8px 18px 6px;font-size:var(--t-xs);font-weight:700;color:var(--sub);border-bottom:1px solid var(--rule)}
.cmp-h span:last-child{text-align:right}
.cmp ol{list-style:none;margin:0;padding:0}
.cmp li a{display:grid;grid-template-columns:1fr 46px 9.5em;gap:10px;align-items:center;padding:11px 18px;text-decoration:none;border-bottom:1px solid var(--rule)}
.cmp li:last-child a{border-bottom:0}
.cmp li a:hover{background:var(--paper-tint)}
.cmp .nm b{display:block;font-size:var(--t-ms);font-weight:800;line-height:1.35}
.cmp .nm small{display:block;font-size:var(--t-s);color:var(--sub);line-height:1.4}
.cmp .rt{font-size:var(--t-m);font-weight:800;color:var(--star)}
.cmp .tot{text-align:right}
.cmp .tot b{display:block;font-size:var(--t-b);font-weight:800;letter-spacing:-.02em}
.cmp .bar{display:block;height:6px;border-radius:3px;background:var(--bg);margin-top:5px;overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:3px;background:var(--line-strong)}
.cmp li.low .bar i{background:var(--mint)}
.cmp li.low .tot b::after{content:"가장 싸요";display:inline-block;margin-left:6px;font-size:var(--t-xs);font-weight:800;color:var(--on-mint);background:var(--mint-wash);border-radius:var(--r-xs);padding:1px 6px;vertical-align:2px}
.hotel{scroll-margin-top:70px}
.hmap{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:var(--r-m);border:1.5px solid var(--rule);font-size:var(--t-ms);font-weight:800;text-decoration:none;color:var(--ink)}
.hmap:hover{border-color:var(--ink)}
.hmap svg{width:18px;height:18px;color:var(--mint-deep)}

/* 날씨 칸 */
.temps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 18px 6px}
.temps div{background:var(--bg);border-radius:var(--r-m);padding:10px 12px;text-align:center}
.temps b{display:block;font-size:var(--t-3x);font-weight:800;letter-spacing:-.03em}
.temps span{font-size:var(--t-s);color:var(--sub);font-weight:700}

/* 우동집 목록 */
.shops{list-style:none;margin:0;padding:2px 18px}
.shops li{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;align-items:start;padding:13px 0;border-bottom:1px solid var(--rule)}
.shops li:last-child{border-bottom:0}
.shops .n{grid-row:1 / span 2;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:var(--t-s);font-weight:800;display:grid;place-items:center;margin-top:1px}
.shops a{display:inline-block;padding:3px 0 1px;font-weight:700;font-size:var(--t-b);text-decoration:none;border-bottom:1px solid var(--rule)}
.shops .when{grid-column:3;grid-row:1;font-size:var(--t-m);font-weight:800;color:var(--mint-deep);white-space:nowrap}
.shops small{grid-column:2 / span 2;font-size:var(--t-m);color:var(--sub)}

/* 비용, 준비물 */
.costs{list-style:none;margin:0;padding:4px 18px}
.costs li{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--rule)}
.costs li:last-child{border-bottom:0}
.costs b{font-weight:700;white-space:nowrap}
.costs span small{display:block;font-size:var(--t-m);color:var(--sub)}

/* 투표 */
.tally{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tally p{font-size:var(--t-ms);color:var(--sub)}
.tally strong{font-size:var(--t-4x);font-weight:800;color:var(--ink);letter-spacing:-.03em;margin-right:4px}
.bar{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.bar i{height:10px;border-radius:var(--r-xs);background:var(--rule)}
.bar i.on{background:var(--mint)}
.bar i.on.b{background:var(--ink)}
.split3{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--t-m);font-weight:700}
.split3 i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
form{padding:18px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0;min-width:0}
.field>label,.field>legend{font-size:var(--t-ms);font-weight:700;padding:0}
input[type=text],textarea{font:inherit;color:inherit;background:var(--paper);border:1.5px solid var(--line-strong);border-radius:var(--r-m);padding:12px 14px;width:100%}
input[type=text]::placeholder{color:var(--mute)}
input[type=text]:focus,textarea:focus{outline:0;border-color:var(--mint);box-shadow:0 0 0 4px var(--mint-wash)}
textarea{min-height:76px;resize:vertical}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);padding:5px;border-radius:var(--r-m)}
.seg label{position:relative;text-align:center;padding:11px 6px;font-size:var(--t-b);font-weight:600;cursor:pointer;border-radius:var(--r-s);color:var(--sub);line-height:1.35}
.seg label small{display:block;font-size:var(--t-xs);font-weight:600}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--paper);color:var(--ink);font-weight:800;box-shadow:0 1px 4px rgba(20,26,25,.14)}
.seg label:has(input:focus-visible){outline:3px solid var(--mint);outline-offset:-3px}
.check{display:flex;align-items:center;gap:10px;font-size:var(--t-b);font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--mint);margin:0;flex:none}
.send{font:inherit;font-weight:800;font-size:var(--t-l);background:var(--black);color:#fff;border:0;border-radius:var(--r-m);padding:16px 18px;cursor:pointer}
.send[disabled]{opacity:.5;cursor:default}
.msg{font-size:var(--t-ms);line-height:1.6;padding:11px 13px;border-radius:var(--r-s);background:var(--mint-wash)}
.msg.err{background:var(--red-wash);color:var(--red-deep)}
.notice{padding:18px;display:flex;flex-direction:column;gap:12px}
.sub-h{font-size:var(--t-l);font-weight:800;margin-top:6px}
.answers{list-style:none;margin:0;padding:2px 18px}
.answers li{padding:13px 0;border-bottom:1px solid var(--rule);line-height:1.5}
.answers li:last-child{border-bottom:0}
.answers b{font-weight:700;font-size:var(--t-b)}
.answers p{color:var(--sub);font-size:var(--t-m)}
.tag{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:var(--r-xs);font-size:var(--t-s);font-weight:700;vertical-align:1px}
.tag.go{background:var(--mint);color:#fff}.tag.no{background:var(--bg);color:var(--sub)}
.stamp{margin-left:8px;font-size:var(--t-s);color:var(--sub)}
.gmsg{color:var(--ink)!important;font-size:var(--t-ms)!important;margin-top:4px;white-space:pre-wrap}
footer{font-size:var(--t-s);color:var(--sub);line-height:1.6}

@keyframes pop{0%{transform:scale(.88) rotate(-4deg)}100%{transform:none}}
@keyframes stamp{0%{transform:scale(1.9) rotate(-12deg)}100%{transform:none}}
@keyframes fly{0%{left:0;opacity:0}12%{opacity:1}100%{left:calc(100% - 22px);opacity:1}}
@keyframes flow{to{stroke-dashoffset:-12}}
@keyframes ping{0%{transform:scale(.6);opacity:.7}80%,100%{transform:scale(2);opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  .plane{left:calc(50% - 11px)}
  .ring{display:none}
}
</style>
</head>

 +'</section>'
 +'<section><h2>우동 스탬프</h2><p class="lede">이번 여행에서 먹을 일곱 그릇과 집마다 먹을 메뉴예요. 가게 이름을 누르면 구글 지도가 열려요. 쉬는 날이 정해져 있지 않은 곳은 출발 일주일 전에 다시 확인할게요.</p>'+shops()+'</section>'
 +'<section><h2>혈당 스파이크 조심</h2><p class="lede">사흘 동안 우동 일곱 그릇, 토요일 오전에만 세 그릇이에요. 흰 면을 빈속에 연달아 먹으면 혈당이 확 올랐다가 떨어져서 오후에 졸리고 처져요.</p><div class="card"><div class="tips">'+'<div><b>면보다 반찬 먼저</b><span>우엉·채소 튀김, 날달걀, 어묵 같은 걸 먼저 몇 입 먹고 면을 먹어요. 가마타마의 달걀도 도움이 돼요.</span></div>'+'<div><b>무조건 소(1玉)</b><span>대(2玉)는 참아요. 소 세 그릇이 일반 식당 두 그릇쯤이에요.</span></div>'+'<div><b>먹고 나서 10분 걷기</b><span>가게 주변을 한 바퀴 돌고 차에 타요. 지치부가하마 모래사장 산책도 여기에 들어가요.</span></div>'+'<div><b>국물은 조금만, 튀김은 하나만</b><span>튀김을 고르면 면을 줄여요.</span></div>'+'<div><b>음료는 물이나 녹차</b><span>편의점 단 음료와 단팥빵은 우동 사이에 넣지 않아요.</span></div>'+'<div><b>그릇 사이 간격 두기</b><span>오전 세 집은 한 시간쯤씩 떨어져 있어요. 줄 서는 시간도 쉬는 시간이에요.</span></div>'+'</div></div><p class="small">당뇨가 있거나 혈당 관리 중인 사람은 각자 평소 관리법을 우선으로 해요.</p></section>'
 +moveSec()+carSec()+staySec()+shopSec()+buySec()+taxSec()+tipSec()
 +'<section id="cost"><h2>예상 비용</h2><div class="card"><ul class="costs">'
 +'<li><span>왕복 항공권<small>1인, 11월 17일 검색 기준</small></span><b class="num">346,701원</b></li>'
 +'<li><span>공항 리무진 버스<small>1인 왕복, 내리는 정류장에 따라 달라요</small></span><b class="num">1,800~2,000엔</b></li>'
 +'<li><span>렌터카, 기름값, 통행료<small>일행이 같이 나눠요</small></span><b>예약 후 공유</b></li>'
 +'<li><span>숙소<small>2인 1객실, 3박 합계, 11월 18일 구글 호텔 조회 기준</small></span><b class="num">약 20만~50만원</b></li>'
 +'<li><span>우동<small>대부분 한 그릇 200~600엔, 현금</small></span><b>각자</b></li>'
 +'</ul></div></section>'
 +'<section id="pack"><h2>챙길 것</h2><p class="lede">체크해 두면 이 기기에서 다음에 열어도 남아 있어요.</p>'+pack()+'</section>'
 +'<section id="vote-sec"><h2>같이 가는 사람</h2><p class="lede">참석 확정이에요. 이제 항공권, 렌터카, 숙소 순서로 예약해요.</p>'+crew()+'</section>'
 +guest()
 +'<footer>메드 아저씨가 만든 안내 페이지예요. 항공사나 여행사의 공식 안내가 아니에요.</footer>'
 +'</main>'+dock();
 view.anim=false;
 watchDock();spy();watchCrew();
 try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('animateMotion').forEach(function(a){a.parentNode.setAttribute('cx','510');a.parentNode.setAttribute('cy','84');a.remove()})}}catch(e){}
 if(keep){var el=document.getElementById(keep);if(el)try{el.focus({preventScroll:true})}catch(e){}}
}
function readDraft(){
 var f=document.getElementById('vote');
 if(f){var a=f.querySelector('input[name=att]:checked'),s=f.querySelector('input[name=size]:checked');
  view.draft={name:document.getElementById('f-name').value.trim(),att:a?a.value:'',size:s?s.value:'2',
   drive:document.getElementById('f-drive').checked,memo:document.getElementById('f-memo').value.trim()}}
 var g=document.getElementById('guest');
 if(g)view.gdraft={name:document.getElementById('g-name').value.trim(),msg:document.getElementById('g-msg').value.trim()};
}
function api(body){
 var ctl=('AbortController' in window)?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort()},15000);
 var opt=body?{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}:{};
 if(ctl)opt.signal=ctl.signal;
 return fetch(ENDPOINT,opt).then(function(r){return r.json()}).then(function(j){clearTimeout(t);if(!j||!j.ok){var e=new Error('server');e.user=j&&j.error;throw e}return j.data},function(e){clearTimeout(t);throw e});
}
function load(){
 view.load='loading';render();
 api().then(function(d){view.data=d;view.load='ready';readDraft();render()},function(){view.load='error';readDraft();render()});
}
function submitVote(){
 readDraft();var d=view.draft;
 if(!d.name){view.err=true;view.msg='이름을 적어 주세요.';render();return}
 if(!d.att){view.err=true;view.msg='갈게요, 못 가요 중에서 골라 주세요.';render();return}
 view.busy='vote';view.msg='';render();
 var go=d.att!=='no';
 api({type:'vote',name:d.name,size:d.size,plans:go?[PLANS.b.k]:[],memo:(go&&d.drive?DRIVE:'')+d.memo}).then(function(data){
  view.data=data;view.load='ready';view.busy='';view.err=false;view.msg='받았어요. 고마워요!';
  view.draft={name:'',att:'',size:'2',drive:false,memo:''};render();
 },function(e){view.busy='';view.err=true;view.msg=(e&&e.user)||'보내지 못했어요. 잠시 후 다시 눌러 주세요.';readDraft();render()});
}
function submitGuest(){
 readDraft();var d=view.gdraft;
 if(!d.name||!d.msg){view.gerr=true;view.gmsg=!d.name&&!d.msg?'이름과 남길 말을 적어 주세요.':(!d.name?'이름을 적어 주세요.':'남길 말을 적어 주세요.');render();return}
 view.busy='guest';view.gmsg='';render();
 api({type:'guest',name:d.name,msg:d.msg}).then(function(data){
  view.data=data;view.load='ready';view.busy='';view.gerr=false;view.gmsg='방명록에 남겼어요.';view.gdraft={name:'',msg:''};render();
 },function(e){view.busy='';view.gerr=true;view.gmsg=(e&&e.user)||'남기지 못했어요. 잠시 후 다시 눌러 주세요.';readDraft();render()});
}
document.addEventListener('submit',function(ev){ev.preventDefault();if(view.busy)return;if(ev.target.id==='vote')submitVote();else if(ev.target.id==='guest')submitGuest()});
render();
if(LIVE&&READY)load();
})();
</script>
