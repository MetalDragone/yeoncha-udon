:root{
  /* 레이아웃: 가운데 정렬한 검은 머리띠(로고, 날짜, 투표 버튼), 그 아래 탑승권, 타임라인 일정, 우동 도장 판. 본문 폭 680px */
  --black:#000;
  --mint:#08B191;        /* 에어서울 민트 */
  --mint-deep:#067562;
  --mint-wash:#E3F5F0;
  --red:#E3122C;         /* 로고의 行 도장, 연차 */
  --ink:#141A19;
  --sub:#5A6663;
  --bg:#F3F6F5;
  --paper:#FFF;
  --rule:#DCE3E1;
  --font:"Pretendard Sub","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16.5px;line-height:1.65;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,p{margin:0}
h2,h3{text-wrap:balance}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.col{max-width:680px;margin:0 auto;padding:0 18px}

/* 머리띠 */
.top{background:var(--black);color:#fff;padding:26px 0 44px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:14px;text-align:left}
.brand svg{width:64px;height:64px;flex:none;animation:pop .8s cubic-bezier(.2,1.5,.4,1) .25s both}
.bubble{position:relative;background:#fff;color:var(--ink);border-radius:16px;padding:8px 14px 9px;line-height:1.3}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:#fff}
.bubble b{display:block;font-size:12.5px;font-weight:800;color:var(--mint-deep)}
.bubble span{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.03em}
.logo{display:block;width:min(100%,400px);height:auto;margin:16px auto 0;animation:pop .8s cubic-bezier(.2,1.5,.4,1) both;transform-origin:50% 60%}
.what{margin-top:10px;font-size:17.5px;font-weight:500;color:#D9E2E0;max-width:23em;margin-left:auto;margin-right:auto}
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:22px auto 0;max-width:460px}
.week div{border-radius:12px;padding:8px 2px 9px;text-align:center;border:1.5px solid rgba(255,255,255,.22);line-height:1.25;color:#9FB0AC}
.week b{display:block;font-size:22px;font-weight:800;color:#fff}
.week span{display:block;font-size:12.5px;font-weight:600}
.week em{display:block;font-style:normal;font-size:12.5px;font-weight:800;margin-top:3px}
.week .go{background:var(--mint);border-color:var(--mint);color:#053B31}
.week .go b{color:var(--black)}
.week .off{background:#fff;border-color:#fff;color:var(--sub)}
.week .off b{color:var(--ink)}
.week .off em{color:var(--red);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
.week .off.late em{animation-delay:.15s}
.week .dim{opacity:.45}

main.col{display:flex;flex-direction:column;gap:44px;margin-top:36px;padding-bottom:64px}
section{display:flex;flex-direction:column;gap:14px;scroll-margin-top:70px}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
section>h2{font-size:24px;font-weight:800;letter-spacing:-.03em}
.lede{color:var(--sub)}
.card{background:var(--paper);border-radius:18px;border:1px solid var(--rule)}
.small{font-size:14.5px;color:var(--sub);line-height:1.6}

/* 탑승권 */
.passes{display:grid;gap:14px}
.pass{overflow:hidden;border:0;box-shadow:0 14px 34px rgba(6,117,98,.16)}
.pass-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 18px;background:var(--mint);color:#fff;font-size:14px;font-weight:600}
.pass-head b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.pass.b .pass-head{background:var(--ink)}
.leg{padding:16px 18px 14px}
.leg+.leg{border-top:1.5px dashed var(--rule)}
.leg-date{font-size:14.5px;font-weight:700;color:var(--mint-deep)}
.leg-date span{color:var(--sub);font-weight:600;margin-left:6px}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-top:6px}
.port b{display:block;font-size:clamp(30px,9.5vw,40px);font-weight:800;line-height:1;letter-spacing:-.03em}
.port span{display:block;font-size:14px;color:var(--sub);margin-top:6px}
.port time{display:block;font-size:20px;font-weight:700;margin-top:2px}
.port.end{text-align:right}
.air{position:relative;text-align:center;font-size:13.5px;color:var(--sub);padding-top:24px;min-height:44px}
.air::before{content:"";position:absolute;left:0;right:0;top:11px;border-top:2px dashed #B9D9D1}
.plane{position:absolute;top:1px;left:0;width:22px;height:22px;animation:fly 3.8s cubic-bezier(.45,0,.3,1) infinite}
.leg+.leg .plane{animation-delay:1.9s}
.fare{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:14px 18px 16px;background:var(--mint-wash);position:relative}
.fare::before,.fare::after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.fare::before{left:-11px}.fare::after{right:-11px}
.fare span{font-size:14.5px;color:var(--sub);line-height:1.5}
.fare strong{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.fare strong small{font-size:15px;font-weight:700;margin-left:2px}

/* 하루 일정 */
.day{overflow:hidden}
.day-head{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--rule)}
.date{flex:none;width:54px;height:54px;border-radius:14px;background:var(--mint-wash);color:var(--mint-deep);display:grid;place-content:center;text-align:center;line-height:1.1}
.date b{font-size:22px;font-weight:800}
.date span{font-size:12.5px;font-weight:700}
.day.tour .date{background:var(--mint);color:#fff}
.day-head h3{font-size:19px;font-weight:800;letter-spacing:-.03em}
.day-head p{font-size:14.5px;color:var(--sub)}
.rows{list-style:none;margin:0;padding:10px 18px 12px}
.rows li{display:grid;grid-template-columns:3.3em 1fr;gap:8px}
.rows li>div{position:relative;padding:8px 0 16px 18px;border-left:2px solid var(--rule)}
.rows li:last-child>div{border-left-color:transparent;padding-bottom:6px}
.rows li>div::before{content:"";position:absolute;left:-7px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid #9FB0AC}
.rows li.eat>div::before{background:var(--red);border-color:var(--red)}
.rows time{font-weight:700;font-size:15.5px;padding-top:8px}
.rows strong{font-weight:700;font-size:16.5px;line-height:1.4}
.rows p{font-size:15px;color:var(--sub);line-height:1.6;margin-top:3px}
.bowl{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:6px;border:1.5px solid var(--red);color:var(--red);font-size:12.5px;font-weight:800;vertical-align:2px;white-space:nowrap;transform:rotate(-3deg)}
.maplink{display:inline-block;margin-top:6px;font-size:14px;font-weight:700;color:var(--mint-deep);text-decoration:none;border-bottom:1.5px solid currentColor;line-height:1.3}
.free{margin:0 18px 16px;padding:12px 14px;border-radius:12px;background:var(--mint-wash);font-size:15px;line-height:1.6}
.free b{font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px 6px}
.split div{border-radius:12px;background:var(--bg);padding:10px 12px}
.split b{display:block;font-size:15px;font-weight:800}
.split span{display:block;font-size:14px;color:var(--sub);line-height:1.55}

/* 코스 약도 */
.course{margin:0 18px 16px;border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.course>svg{display:block;width:100%;height:auto;background:#FBFCFC}
.course .lbl{font-family:var(--font);font-size:25px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#F4FAF8;stroke-width:6px;stroke-linejoin:round}
.course .lbl.dim{font-size:20px;font-weight:600;fill:var(--sub)}
.course .lbl.sea{font-size:22px;fill:var(--mint-deep);font-weight:600}
.route-line{fill:none;stroke:var(--mint);stroke-width:5;stroke-linecap:round;stroke-dasharray:1 11;animation:flow 1s linear infinite}
.route-base{fill:none;stroke:#BFE6DC;stroke-width:5;stroke-linecap:round}
.ring{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
.course-foot{display:flex;flex-direction:column;gap:10px;padding:14px;border-top:1px solid var(--rule)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:800;font-size:17px;background:var(--mint);color:#fff;border-radius:12px;padding:14px 16px}
.btn svg{width:20px;height:20px;flex:none}
.btnwrap{padding:0 18px 16px}

/* 머리띠 아래: 요약과 버튼 */
.facts{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;margin-top:20px;font-size:15px;font-weight:700;color:#fff}
.facts span{display:flex;align-items:center;gap:6px}
.facts span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint)}
.cta{display:flex;justify-content:center;gap:10px;margin-top:22px}
.cta a{flex:0 1 190px;text-align:center;text-decoration:none;font-weight:800;font-size:17px;border-radius:999px;padding:13px 18px}
.cta .go{background:var(--mint);color:#fff}
.cta .ghost{border:1.5px solid rgba(255,255,255,.4);color:#fff}

/* 아래 고정 투표 버튼 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--rule);transition:transform .25s ease}
.dock.hide{transform:translateY(110%)}
.dock .in{max-width:644px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dock p{font-size:14.5px;color:var(--sub);line-height:1.35}
.dock p b{display:block;font-size:17px;color:var(--ink)}
.dock a{flex:none;text-decoration:none;background:var(--black);color:#fff;font-weight:800;font-size:16.5px;border-radius:999px;padding:12px 22px}
body.has-dock main.col{padding-bottom:110px}

/* 우동 스탬프 */
.stamps{list-style:none;margin:0;padding:20px 10px 10px;display:flex;flex-wrap:wrap;justify-content:center;row-gap:20px}
.stamps li{text-align:center;flex:0 0 50%;padding:0 6px}
@media (min-width:600px){.stamps li{flex-basis:25%}}
.stamps a{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none}
.seal{width:92px;height:92px;border-radius:50%;border:3px solid var(--red);color:var(--red);display:grid;place-content:center;line-height:1.1;transform:rotate(var(--r,-4deg));position:relative}
.seal::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px dashed rgba(227,18,44,.45)}
.seal b{font-size:30px;font-weight:900;letter-spacing:-.04em}
.seal span{font-size:13px;font-weight:800}
.stamps strong{font-size:15.5px;font-weight:800;line-height:1.35}
.stamps small{display:block;font-size:13px;color:var(--sub);line-height:1.45;margin-top:-4px}

/* 혈당 팁 */
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0 22px;padding:4px 18px 8px}
.tips div{padding:13px 0 13px 14px;border-bottom:1px solid var(--rule);position:relative}
.tips div::before{content:"";position:absolute;left:0;top:19px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.tips b{display:block;font-size:16px;font-weight:800}
.tips span{display:block;font-size:14.5px;color:var(--sub);line-height:1.55;margin-top:2px}

/* 챙길 것 체크리스트 */
.pack{list-style:none;margin:0;padding:4px 18px}
.pack li{border-bottom:1px solid var(--rule)}
.pack li:last-child{border-bottom:0}
.pack label{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:13px 0;cursor:pointer}
.pack input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--mint)}
.pack b{font-weight:700}
.pack small{display:block;font-size:14px;color:var(--sub)}
.pack input:checked+span b{text-decoration:line-through;color:var(--sub)}

/* 섹션 바로가기 */
.toc{position:sticky;top:0;z-index:4;background:rgba(240,244,243,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.toc .col{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;scrollbar-width:none}
.toc .col::-webkit-scrollbar{display:none}
.toc a{flex:none;text-decoration:none;font-size:14.5px;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:7px 13px}
.toc a.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 확정 도장 */
.ok-stamp{display:inline-block;border:2.5px solid #fff;border-radius:8px;padding:1px 9px;font-size:15px;font-weight:900;transform:rotate(-4deg)}

/* 표 형태 목록: 왼쪽 이름, 오른쪽 값 */
.kv{list-style:none;margin:0;padding:4px 18px}
.kv li{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--rule)}
.kv li:last-child{border-bottom:0}
.kv span small{display:block;font-size:14px;color:var(--sub);line-height:1.55;margin-top:2px}
.kv b{font-weight:800;white-space:nowrap;text-align:right}
.kv b small{display:block;font-size:13px;font-weight:600;color:var(--sub)}

/* 순서가 있는 단계 */
.steps{list-style:none;margin:0;padding:6px 18px 10px;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:12px 0 12px 40px;border-bottom:1px solid var(--rule)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(st);position:absolute;left:0;top:12px;width:27px;height:27px;border-radius:50%;background:var(--mint);color:#fff;font-weight:800;font-size:14.5px;display:grid;place-items:center}
.steps b{display:block;font-size:16px;font-weight:800}
.steps span{display:block;font-size:14.5px;color:var(--sub);line-height:1.6;margin-top:2px}

/* 숙소 */
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.area{padding:16px 18px}
.area h3{font-size:17px;font-weight:800}
.area p{font-size:14.5px;color:var(--sub);line-height:1.6;margin-top:4px}
.area .for{display:inline-block;margin-top:8px;font-size:13px;font-weight:800;color:var(--mint-deep)}
.hotels{list-style:none;margin:0;padding:2px 18px}
.hotels li{padding:14px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.hotels li:last-child{border-bottom:0}
.hotels a{justify-self:start;font-weight:800;font-size:16.5px;text-decoration:none;border-bottom:1px solid var(--rule)}
.hotels .price{grid-column:2;grid-row:1;font-weight:800;white-space:nowrap;text-align:right}
.hotels .where{grid-column:1 / -1;font-size:13.5px;font-weight:700;color:var(--mint-deep)}
.hotels p{grid-column:1 / -1;font-size:14.5px;color:var(--sub);line-height:1.55}

/* 날씨 칸 */
.temps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 18px 6px}
.temps div{background:var(--bg);border-radius:12px;padding:10px 12px;text-align:center}
.temps b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em}
.temps span{font-size:13px;color:var(--sub);font-weight:700}

/* 우동집 목록 */
.shops{list-style:none;margin:0;padding:2px 18px}
.shops li{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;align-items:start;padding:13px 0;border-bottom:1px solid var(--rule)}
.shops li:last-child{border-bottom:0}
.shops .n{grid-row:1 / span 2;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.shops a{font-weight:700;font-size:16.5px;text-decoration:none;border-bottom:1px solid var(--rule)}
.shops .when{grid-column:3;grid-row:1;font-size:14px;font-weight:800;color:var(--mint-deep);white-space:nowrap}
.shops small{grid-column:2 / span 2;font-size:14px;color:var(--sub)}

/* 비용, 준비물 */
.costs{list-style:none;margin:0;padding:4px 18px}
.costs li{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--rule)}
.costs li:last-child{border-bottom:0}
.costs b{font-weight:700;white-space:nowrap}
.costs span small{display:block;font-size:14px;color:var(--sub)}

/* 투표 */
.tally{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tally p{font-size:15px;color:var(--sub)}
.tally strong{font-size:30px;font-weight:800;color:var(--ink);letter-spacing:-.03em;margin-right:4px}
.bar{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.bar i{height:10px;border-radius:5px;background:var(--rule)}
.bar i.on{background:var(--mint)}
.bar i.on.b{background:var(--ink)}
.split3{display:flex;gap:14px;flex-wrap:wrap;font-size:14.5px;font-weight:700}
.split3 i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
form{padding:18px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0;min-width:0}
.field>label,.field>legend{font-size:15px;font-weight:700;padding:0}
input[type=text],textarea{font:inherit;color:inherit;background:var(--paper);border:1.5px solid #B2BFBC;border-radius:12px;padding:12px 14px;width:100%}
input[type=text]::placeholder{color:#8A9693}
input[type=text]:focus,textarea:focus{outline:0;border-color:var(--mint);box-shadow:0 0 0 4px var(--mint-wash)}
textarea{min-height:76px;resize:vertical}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);padding:5px;border-radius:14px}
.seg label{position:relative;text-align:center;padding:11px 6px;font-size:16px;font-weight:600;cursor:pointer;border-radius:10px;color:var(--sub);line-height:1.35}
.seg label small{display:block;font-size:12.5px;font-weight:600}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--paper);color:var(--ink);font-weight:800;box-shadow:0 1px 4px rgba(20,26,25,.14)}
.seg label:has(input:focus-visible){outline:3px solid var(--mint);outline-offset:-3px}
.check{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--mint);margin:0;flex:none}
.send{font:inherit;font-weight:800;font-size:18px;background:var(--black);color:#fff;border:0;border-radius:12px;padding:16px 18px;cursor:pointer}
.send[disabled]{opacity:.5;cursor:default}
.msg{font-size:15px;line-height:1.6;padding:11px 13px;border-radius:10px;background:var(--mint-wash)}
.msg.err{background:#FDE8EA;color:#9A0C1E}
.notice{padding:18px;display:flex;flex-direction:column;gap:12px}
.sub-h{font-size:17px;font-weight:800;margin-top:6px}
.answers{list-style:none;margin:0;padding:2px 18px}
.answers li{padding:13px 0;border-bottom:1px solid var(--rule);line-height:1.5}
.answers li:last-child{border-bottom:0}
.answers b{font-weight:700;font-size:16.5px}
.answers p{color:var(--sub);font-size:14.5px}
.tag{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:7px;font-size:13px;font-weight:700;vertical-align:1px}
.tag.go{background:var(--mint);color:#fff}.tag.no{background:var(--bg);color:var(--sub)}
.stamp{margin-left:8px;font-size:13px;color:var(--sub)}
.gmsg{color:var(--ink)!important;font-size:15.5px!important;margin-top:4px;white-space:pre-wrap}
footer{font-size:13.5px;color:var(--sub);line-height:1.6}

@keyframes pop{0%{transform:scale(.88) rotate(-4deg)}100%{transform:none}}
@keyframes stamp{0%{transform:scale(1.9) rotate(-12deg)}100%{transform:none}}
@keyframes fly{0%{left:0;opacity:0}10%{opacity:1}62%{left:calc(100% - 22px);opacity:1}72%,100%{left:calc(100% - 22px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-12}}
@keyframes ping{0%{transform:scale(.6);opacity:.7}80%,100%{transform:scale(2);opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  .plane{left:calc(50% - 11px)}
  .ring{display:none}
}
</style>
</head>

  ['14:10','인천 출발 (진에어)','짐은 기내용 하나면 공항에서 바로 나갈 수 있어요.'],
  ['15:50','다카마쓰 공항 도착','입국 심사와 세관을 지나 나오면 바로 앞이 리무진 버스 타는 곳이에요.'],
  ['16:30쯤','리무진 버스로 시내','숙소에 가까운 정류장에서 내려요. 가와라마치(瓦町)까지 30분쯤, 다카마쓰역까지 45분쯤 걸려요.'],
  ['19:00','같이 저녁 (원하는 커플만)','뼈째 구운 닭다리로 유명한 호네쓰키도리 잇카쿠를 저장해 두었어요.',0,'ikkaku']]},
 {n:'16',w:'토',map:'sat',t:'우동 세 그릇, 서쪽 바다에서 노을',sub:'하루 종일 같이 움직이고 밤엔 다 같이 한잔',rows:[
  ['08:00','다카마쓰역 근처에서 렌터카 받기','인원에 맞춰 미니밴이나 차 두 대로 빌려요. 고속도로 스마트IC는 ETC 전용이라 ETC 카드를 꼭 같이 빌려요.'],
  ['09:00','야마고에 우동','날달걀에 비벼 먹는 가마타마 우동이 처음 시작된 집이에요. 토요일엔 손님이 2천 명 넘게 와서 문 여는 시간에 맞춰 가요.',1,'yamagoe'],
  ['10:10','사누키 우동 가모','야마고에에서 차로 20분쯤. 논 옆 벤치에 앉아 먹는 집이에요. 토요일은 13시쯤 닫아요.',1,'gamou'],
  ['11:05','히노데 제면소에서 줄 서기','가모에서 15분. 11:30부터 12:30까지 한 시간만 먹을 수 있는 집이에요.',1,'hinode'],
  ['13:00','고토비키 공원 모래 동전','바닷가 모래에 그린 지름 100m 넘는 옛날 동전이에요. 산 위 전망대에서 내려다봐야 동그랗게 보여요.',0,'kotohiki'],
  ['15:30','지치부가하마에서 노을까지','물웅덩이에 하늘이 비쳐서 일본의 우유니 사막이라 불리는 해변이에요. 바람이 없고 썰물이 노을과 겹치면 제대로 보여요. 해 지는 건 17시 20분쯤이에요.',0,'chichibu'],

 +'<section id="plan"><h2>3박 4일 일정</h2><p class="lede">토요일은 렌터카로 하루 종일, 일요일은 오전까지 같이 다녀요. 나머지는 커플끼리 자유 시간이고, 숙소는 커플마다 따로 잡아요.</p>'+plan()
 +'<p class="small">시간은 대략 잡은 거라 가게 앞 줄에 따라 달라져요. 렌터카 예약 방법은 아래 렌터카 칸에 있어요.</p></section>'
 +'<section><h2>우동 스탬프</h2><p class="lede">이번 여행에서 먹을 일곱 그릇이에요. 도장을 누르면 구글 지도가 열려요. 쉬는 날이 정해져 있지 않은 곳은 출발 일주일 전에 다시 확인할게요.</p>'+shops()+'</section>'
 +'<section><h2>혈당 스파이크 조심</h2><p class="lede">사흘 동안 우동 일곱 그릇, 토요일 오전에만 세 그릇이에요. 흰 면을 빈속에 연달아 먹으면 혈당이 확 올랐다가 떨어져서 오후에 졸리고 처져요.</p><div class="card"><div class="tips">'+'<div><b>면보다 반찬 먼저</b><span>우엉·채소 튀김, 날달걀, 어묵 같은 걸 먼저 몇 입 먹고 면을 먹어요. 가마타마의 달걀도 도움이 돼요.</span></div>'+'<div><b>무조건 소(1玉)</b><span>대(2玉)는 참아요. 소 세 그릇이 일반 식당 두 그릇쯤이에요.</span></div>'+'<div><b>먹고 나서 10분 걷기</b><span>가게 주변을 한 바퀴 돌고 차에 타요. 지치부가하마 모래사장 산책도 여기에 들어가요.</span></div>'+'<div><b>국물은 조금만, 튀김은 하나만</b><span>튀김을 고르면 면을 줄여요.</span></div>'+'<div><b>음료는 물이나 녹차</b><span>편의점 단 음료와 단팥빵은 우동 사이에 넣지 않아요.</span></div>'+'<div><b>그릇 사이 간격 두기</b><span>오전 세 집은 한 시간쯤씩 떨어져 있어요. 줄 서는 시간도 쉬는 시간이에요.</span></div>'+'</div></div><p class="small">당뇨가 있거나 혈당 관리 중인 사람은 각자 평소 관리법을 우선으로 해요.</p></section>'
 +moveSec()+carSec()+staySec()+shopSec()+buySec()+taxSec()+tipSec()
 +'<section id="cost"><h2>예상 비용</h2><div class="card"><ul class="costs">'
 +'<li><span>왕복 항공권<small>1인, 11월 17일 검색 기준</small></span><b class="num">346,701원</b></li>'
 +'<li><span>공항 리무진 버스<small>1인 왕복, 내리는 정류장에 따라 달라요</small></span><b class="num">1,800~2,000엔</b></li>'
 +'<li><span>렌터카, 기름값, 통행료<small>가는 사람끼리 나눠요</small></span><b>예약 후 공유</b></li>'
 +'<li><span>숙소<small>객실 1박, 커플마다 따로</small></span><b class="num">6~13만원대</b></li>'
 +'<li><span>우동<small>대부분 한 그릇 200~600엔, 현금</small></span><b>각자</b></li>'
 +'</ul></div></section>'
 +'<section id="pack"><h2>챙길 것</h2><p class="lede">체크해 두면 이 기기에서 다음에 열어도 남아 있어요.</p>'+pack()+'</section>'
 +'<section id="vote-sec"><h2>참석 체크</h2><p class="lede">B안 일정으로 갈 수 있는지 알려 주세요. 운전할 수 있는 사람도 같이 표시해 주세요.</p>'+voteForm()+'</section>'
 +guest()
 +'<footer>메드 아저씨가 만든 안내 페이지예요. 항공사나 여행사의 공식 안내가 아니에요.</footer>'
 +'</main>'+dock();
 view.anim=false;
 watchDock();spy();
 try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('animateMotion').forEach(function(a){a.parentNode.setAttribute('cx','510');a.parentNode.setAttribute('cy','84');a.remove()})}}catch(e){}
 if(keep){var el=document.getElementById(keep);if(el)try{el.focus({preventScroll:true})}catch(e){}}
}
function readDraft(){
 var f=document.getElementById('vote');
 if(f){var a=f.querySelector('input[name=att]:checked'),s=f.querySelector('input[name=size]:checked');
  view.draft={name:document.getElementById('f-name').value.trim(),att:a?a.value:'',size:s?s.value:'2',
   drive:document.getElementById('f-drive').checked,memo:document.getElementById('f-memo').value.trim()}}
 var g=document.getElementById('guest');
 if(g)view.gdraft={name:document.getElementById('g-name').value.trim(),msg:document.getElementById('g-msg').value.trim()};
}
function api(body){
 var ctl=('AbortController' in window)?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort()},15000);
 var opt=body?{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}:{};
 if(ctl)opt.signal=ctl.signal;
 return fetch(ENDPOINT,opt).then(function(r){return r.json()}).then(function(j){clearTimeout(t);if(!j||!j.ok){var e=new Error('server');e.user=j&&j.error;throw e}return j.data},function(e){clearTimeout(t);throw e});
}
function load(){
 view.load='loading';render();
 api().then(function(d){view.data=d;view.load='ready';readDraft();render()},function(){view.load='error';readDraft();render()});
}
function submitVote(){
 readDraft();var d=view.draft;
 if(!d.name){view.err=true;view.msg='이름을 적어 주세요.';render();return}
 if(!d.att){view.err=true;view.msg='갈게요, 못 가요 중에서 골라 주세요.';render();return}
 view.busy='vote';view.msg='';render();
 var go=d.att!=='no';
 api({type:'vote',name:d.name,size:d.size,plans:go?[PLANS.b.k]:[],memo:(go&&d.drive?DRIVE:'')+d.memo}).then(function(data){
  view.data=data;view.load='ready';view.busy='';view.err=false;view.msg='받았어요. 고마워요!';
  view.draft={name:'',att:'',size:'2',drive:false,memo:''};render();
 },function(e){view.busy='';view.err=true;view.msg=(e&&e.user)||'보내지 못했어요. 잠시 후 다시 눌러 주세요.';readDraft();render()});
}
function submitGuest(){
 readDraft();var d=view.gdraft;
 if(!d.name||!d.msg){view.gerr=true;view.gmsg='이름과 남길 말을 적어 주세요.';render();return}
 view.busy='guest';view.gmsg='';render();
 api({type:'guest',name:d.name,msg:d.msg}).then(function(data){
  view.data=data;view.load='ready';view.busy='';view.gerr=false;view.gmsg='남겼어요.';view.gdraft={name:'',msg:''};render();
 },function(e){view.busy='';view.gerr=true;view.gmsg=(e&&e.user)||'남기지 못했어요. 잠시 후 다시 눌러 주세요.';readDraft();render()});
}
document.addEventListener('submit',function(ev){ev.preventDefault();if(view.busy)return;if(ev.target.id==='vote')submitVote();else if(ev.target.id==='guest')submitGuest()});
render();
if(LIVE&&READY)load();
})();
</script>
