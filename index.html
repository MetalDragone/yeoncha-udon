:root{
  /* 레이아웃: 로고가 놓인 검은 머리띠, 그 아래 흰 카드가 한 줄로 이어지는 구성. 왼쪽 정렬, 본문 폭 680px */
  --black:#000;          /* 로고 바탕과 같은 검정 */
  --mint:#08B191;        /* 에어서울 민트 */
  --mint-deep:#067562;
  --mint-wash:#E3F5F0;
  --red:#E3122C;         /* 로고의 行 도장, 연차 표시 */
  --ink:#141A19;
  --sub:#5A6663;
  --bg:#F3F6F5;
  --paper:#FFF;
  --rule:#DCE3E1;
  --font:"Pretendard Sub","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16.5px;line-height:1.65;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,p{margin:0}
h2,h3{text-wrap:balance}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.col{max-width:680px;margin:0 auto;padding:0 18px}

/* 머리띠 */
.top{background:var(--black);color:#fff;padding:22px 0 84px}
.host{font-size:14px;font-weight:600;color:#9FB0AC}
.logo{display:block;width:min(100%,400px);height:auto;margin:14px 0 0 -6px;animation:pop .8s cubic-bezier(.2,1.5,.4,1) both;transform-origin:30% 60%}
.what{margin-top:10px;font-size:17.5px;font-weight:500;color:#D9E2E0;max-width:23em}

main.col{display:flex;flex-direction:column;gap:44px;margin-top:-56px;padding-bottom:64px}
section{display:flex;flex-direction:column;gap:14px}
section>h2{font-size:24px;font-weight:800;letter-spacing:-.03em}
.lede{color:var(--sub)}
.card{background:var(--paper);border-radius:18px;border:1px solid var(--rule)}
.small{font-size:14.5px;color:var(--sub);line-height:1.6}

/* 탑승권 */
.pass{overflow:hidden;border:0;box-shadow:0 14px 34px rgba(6,117,98,.18)}
.pass-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 18px;background:var(--mint);color:#fff;font-size:14px;font-weight:600}
.pass-head b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.leg{padding:16px 18px 14px}
.leg+.leg{border-top:1.5px dashed var(--rule)}
.leg-date{font-size:14.5px;font-weight:700;color:var(--mint-deep)}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-top:6px}
.port b{display:block;font-size:clamp(32px,10vw,42px);font-weight:800;line-height:1;letter-spacing:-.03em}
.port span{display:block;font-size:14px;color:var(--sub);margin-top:6px}
.port time{display:block;font-size:20px;font-weight:700;margin-top:2px}
.port.end{text-align:right}
.air{position:relative;text-align:center;font-size:13.5px;color:var(--sub);padding-top:24px;min-height:44px}
.air::before{content:"";position:absolute;left:0;right:0;top:11px;border-top:2px dashed #B9D9D1}
.plane{position:absolute;top:1px;left:0;width:22px;height:22px;animation:fly 3.8s cubic-bezier(.45,0,.3,1) infinite}
.leg+.leg .plane{animation-delay:1.9s}

/* 날짜 후보 */
.opts{display:grid;gap:12px}
.opt{padding:16px 18px 16px;display:flex;flex-direction:column;gap:12px}
.opt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.opt-name{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.opt-meta{font-size:14.5px;color:var(--sub);margin-top:4px}
.opt-price{text-align:right;white-space:nowrap}
.opt-price strong{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.opt-price strong small{font-size:15px;font-weight:700;margin-left:1px}
.opt-price span{display:block;font-size:13px;color:var(--sub)}
.badge{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:7px;font-size:12.5px;font-weight:800;vertical-align:4px;background:var(--mint);color:#fff}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.days div{border-radius:9px;text-align:center;padding:6px 0 7px;line-height:1.2;background:var(--bg);color:#9AA6A3}
.days b{display:block;font-size:16px;font-weight:800}
.days span{display:block;font-size:12px;font-weight:600}
.days .in{background:var(--mint-wash);color:var(--mint-deep)}
.days .in.leave{background:#FDE8EA;color:var(--red)}
.days em{display:block;font-style:normal;font-size:11px;font-weight:800}
.votes{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700}
.meter{flex:1;height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint);border-radius:5px;transition:width .5s ease}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--sub)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}

/* 투표 폼 */
form{padding:18px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0;min-width:0}
.field>label,.field>legend{font-size:15px;font-weight:700;padding:0}
input[type=text],textarea{font:inherit;color:inherit;background:var(--paper);border:1.5px solid #B2BFBC;border-radius:12px;padding:12px 14px;width:100%}
input[type=text]::placeholder,textarea::placeholder{color:#8A9693}
input[type=text]:focus,textarea:focus{outline:0;border-color:var(--mint);box-shadow:0 0 0 4px var(--mint-wash)}
textarea{min-height:76px;resize:vertical}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);padding:5px;border-radius:14px}
.seg label{position:relative;text-align:center;padding:11px 6px;font-size:16px;font-weight:600;cursor:pointer;border-radius:10px;color:var(--sub)}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--paper);color:var(--ink);font-weight:800;box-shadow:0 1px 4px rgba(20,26,25,.14)}
.seg label:has(input:focus-visible){outline:3px solid var(--mint);outline-offset:-3px}
.picks{display:grid;gap:8px}
.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid #B2BFBC;border-radius:12px;cursor:pointer;background:var(--paper)}
.pick input{width:22px;height:22px;accent-color:var(--mint);margin:0;flex:none}
.pick b{font-size:16.5px;font-weight:800}
.pick span{font-size:14px;color:var(--sub)}
.pick em{margin-left:auto;font-style:normal;font-weight:800;white-space:nowrap}
.pick:has(input:checked){border-color:var(--mint);background:var(--mint-wash)}
.pick.none:has(input:checked){border-color:var(--ink);background:var(--bg)}
.send{font:inherit;font-weight:800;font-size:18px;background:var(--black);color:#fff;border:0;border-radius:12px;padding:16px 18px;cursor:pointer}
.send[disabled]{opacity:.5;cursor:default}
.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:800;font-size:17px;background:var(--mint);color:#fff;border-radius:12px;padding:14px 16px}
.msg{font-size:15px;line-height:1.6;padding:11px 13px;border-radius:10px;background:var(--mint-wash)}
.msg.err{background:#FDE8EA;color:#9A0C1E}
.notice{padding:18px;display:flex;flex-direction:column;gap:12px}
.sub-h{font-size:17px;font-weight:800;margin-top:6px}
.answers{list-style:none;margin:0;padding:2px 18px}
.answers li{padding:13px 0;border-bottom:1px solid var(--rule);line-height:1.5}
.answers li:last-child{border-bottom:0}
.answers b{font-weight:700;font-size:16.5px}
.answers p{color:var(--sub);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:2px 9px;border-radius:7px;font-size:13px;font-weight:700;background:var(--mint-wash);color:var(--mint-deep)}
.chip.no{background:var(--bg);color:var(--sub)}
.when{margin-left:8px;font-size:13px;color:var(--sub)}
.gmsg{color:var(--ink)!important;font-size:15.5px!important;margin-top:4px;white-space:pre-wrap}
footer{font-size:13.5px;color:var(--sub);line-height:1.6}

@keyframes pop{0%{transform:scale(.88) rotate(-4deg)}100%{transform:none}}
@keyframes fly{0%{left:0;opacity:0}10%{opacity:1}62%{left:calc(100% - 22px);opacity:1}72%,100%{left:calc(100% - 22px);opacity:0}}
@keyframes rise{0%{transform:scaleY(.4);opacity:.3}100%{transform:none;opacity:1}}
.days .in{animation:rise .5s cubic-bezier(.3,1.4,.5,1) both;transform-origin:bottom}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .plane{left:calc(50% - 11px)}
}
</style>
</head>

 {k:'16-19',name:'토~화',range:'1월 16일 (토) ~ 19일 (화)',len:'3박 4일',leave:2,price:356600,from:16,to:19}
];
var BY={};OPTS.forEach(function(o){BY[o.k]=o});
var CHEAP=OPTS.reduce(function(a,b){return b.price<a.price?b:a});

var view={draft:{name:'',size:'2',plans:[],none:false,memo:''},gdraft:{name:'',msg:''},msg:'',err:false,gmsg:'',gerr:false,busy:'',data:null,load:'idle',anim:true};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function won(n){return n.toLocaleString('ko-KR')}
function when(t){try{var d=new Date(t);return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}catch(e){return ''}}
function counts(){
 var c={},people=0;OPTS.forEach(function(o){c[o.k]=0});
 ((view.data&&view.data.votes)||[]).forEach(function(v){var n=v.size===1?1:2;people+=n;(v.plans||[]).forEach(function(k){if(c[k]!=null)c[k]+=n})});
 return {c:c,people:people};
}

var PLANE='<svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path fill="#08B191" d="M21.5 12c0-.8-.7-1.5-1.5-1.5h-5.2L9.6 3H7.4l2.4 7.5H5.4L3.9 8.6H2.4L3.3 12l-.9 3.4h1.5l1.5-1.9h4.4L7.4 21h2.2l5.2-7.5H20c.8 0 1.5-.7 1.5-1.5z"/></svg>';
function leg(label,fc,fn,ft,tc,tn,tt,dur){
 return '<div class="leg"><p class="leg-date">'+label+'</p><div class="route">'
 +'<div class="port"><b>'+fc+'</b><span>'+fn+'</span><time class="num">'+ft+'</time></div>'
 +'<div class="air">'+PLANE+dur+'</div>'
 +'<div class="port end"><b>'+tc+'</b><span>'+tn+'</span><time class="num">'+tt+'</time></div></div></div>';
}
function pass(){
 return '<div class="card pass"><div class="pass-head"><b>에어서울 직항</b><span>네 후보 모두 같은 시간</span></div>'
 +leg('가는 날','ICN','인천','08:45','TAK','다카마쓰','10:30','1시간 45분')
 +leg('오는 날','TAK','다카마쓰','11:40','ICN','인천','13:20','1시간 40분')+'</div>';
}
function strip(o){
 return '<div class="days" aria-hidden="true">'+DAYS.map(function(d,i){
  var on=d[0]>=o.from&&d[0]<=o.to,wk=d[1]==='토'||d[1]==='일',lv=on&&!wk;
  return '<div class="'+(on?'in':'')+(lv?' leave':'')+'"'+(on&&view.anim?' style="animation-delay:'+(.05*i+.1)+'s"':'')+'><span>'+d[1]+'</span><b class="num">'+d[0]+'</b><em>'+(lv?'연차':on?'&nbsp;':'&nbsp;')+'</em></div>'}).join('')+'</div>';
}
function options(){
 var t=counts(),max=Math.max(8,t.people);
 return '<div class="opts">'+OPTS.map(function(o){
  var n=t.c[o.k];
  return '<article class="card opt" aria-label="'+o.name+', '+o.range+', '+o.len+', 연차 '+o.leave+'일, 1인 '+won(o.price)+'원">'
  +'<div class="opt-top"><div><h3 class="opt-name">'+o.name+(o===CHEAP?'<span class="badge">가장 싸요</span>':'')+'</h3>'
  +'<p class="opt-meta">'+o.range+'<br>'+o.len+', 연차 '+o.leave+'일</p></div>'
  +'<div class="opt-price"><strong class="num">'+won(o.price)+'<small>원</small></strong><span>1인 왕복</span></div></div>'
  +strip(o)
  +(LIVE&&READY&&view.load==='ready'?'<div class="votes"><span class="num">가능 '+n+'명</span><div class="meter"><i style="width:'+Math.round(n/max*100)+'%"></i></div></div>':'')
  +'</article>'}).join('')+'</div>'
  +'<div class="legend"><span><i style="background:var(--mint-wash)"></i>주말</span><span><i style="background:#FDE8EA"></i>연차 쓰는 날</span></div>';
}
function voteForm(){
 if(!LIVE)return '<div class="card notice"><p>투표와 방명록은 아래 주소에서 할 수 있어요.</p><a class="btn" href="'+SITE+'" target="_blank" rel="noopener">투표하러 가기</a></div>';
 if(!READY)return '<div class="card notice"><p>투표는 곧 열려요. 조금만 기다려 주세요.</p></div>';
 var d=view.draft,b=view.busy==='vote';
 return '<div class="card"><form id="vote" novalidate>'
 +'<div class="field"><label for="f-name">이름</label><input type="text" id="f-name" maxlength="20" autocomplete="name" placeholder="커플이면 두 사람 이름 다 적어 주세요" value="'+esc(d.name)+'"></div>'
 +'<fieldset class="field"><legend>몇 명이에요?</legend><div class="seg">'
 +[['2','둘이서'],['1','혼자']].map(function(o){return '<label><input type="radio" name="size" id="f-size-'+o[0]+'" value="'+o[0]+'"'+(d.size===o[0]?' checked':'')+'>'+o[1]+'</label>'}).join('')+'</div></fieldset>'
 +'<fieldset class="field"><legend>갈 수 있는 날짜 (여러 개 골라도 돼요)</legend><div class="picks">'
 +OPTS.map(function(o){return '<label class="pick"><input type="checkbox" name="plans" id="f-p-'+o.k+'" value="'+o.k+'"'+(d.plans.indexOf(o.k)>=0?' checked':'')+'><div><b>'+o.name+'</b><br><span>'+o.range.replace('1월 ','')+', 연차 '+o.leave+'일</span></div><em class="num">'+won(o.price)+'원</em></label>'}).join('')
 +'<label class="pick none"><input type="checkbox" id="f-none"'+(d.none?' checked':'')+'><div><b>이번엔 어려워요</b></div></label>'
 +'</div></fieldset>'
 +'<div class="field"><label for="f-memo">하고 싶은 말 (선택)</label><textarea id="f-memo" maxlength="200">'+esc(d.memo)+'</textarea></div>'
 +'<button class="send" type="submit"'+(b?' disabled':'')+'>'+(b?'투표하는 중':'투표하기')+'</button>'
 +(view.msg?'<p class="msg'+(view.err?' err':'')+'" role="status">'+esc(view.msg)+'</p>':'')
 +'<p class="small">같은 이름으로 다시 투표하면 답이 바뀌어요.</p>'
 +'</form></div>'
 +'<h3 class="sub-h">투표한 사람</h3>'+voters();
}
function voters(){
 if(view.load==='loading')return '<p class="small">투표 결과를 불러오는 중이에요.</p>';
 if(view.load==='error')return '<p class="small">투표 결과를 불러오지 못했어요. 잠시 후 새로고침해 주세요.</p>';
 var V=(view.data&&view.data.votes)||[];
 if(!V.length)return '<p class="small">아직 투표한 사람이 없어요. 첫 번째로 투표해 주세요.</p>';
 return '<div class="card"><ul class="answers">'+V.map(function(v){
  var ps=(v.plans||[]).filter(function(k){return BY[k]});
  return '<li><b>'+esc(v.name)+'</b><span class="when">'+(v.size===1?'혼자':'둘이서')+'</span>'
  +'<div class="chips">'+(ps.length?ps.map(function(k){return '<span class="chip">'+BY[k].name+'</span>'}).join(''):'<span class="chip no">이번엔 어려워요</span>')+'</div>'
  +(v.memo?'<p>'+esc(v.memo)+'</p>':'')+'</li>'}).join('')+'</ul></div>';
}
function guest(){
 if(!LIVE||!READY)return '';
 var d=view.gdraft,b=view.busy==='guest',G=(view.data&&view.data.guestbook)||[];
 return '<section><h2>방명록</h2><p class="lede">기대되는 것, 꼭 먹고 싶은 우동, 하고 싶은 말을 남겨 주세요.</p>'
 +'<div class="card"><form id="guest" novalidate>'
 +'<div class="field"><label for="g-name">이름</label><input type="text" id="g-name" maxlength="20" value="'+esc(d.name)+'"></div>'
 +'<div class="field"><label for="g-msg">남길 말</label><textarea id="g-msg" maxlength="200">'+esc(d.msg)+'</textarea></div>'
 +'<button class="send" type="submit"'+(b?' disabled':'')+'>'+(b?'남기는 중':'방명록 남기기')+'</button>'
 +(view.gmsg?'<p class="msg'+(view.gerr?' err':'')+'" role="status">'+esc(view.gmsg)+'</p>':'')
 +'</form></div>'
 +(view.load==='ready'?(G.length?'<div class="card"><ul class="answers">'+G.map(function(x){return '<li><b>'+esc(x.name)+'</b><span class="when">'+when(x.time)+'</span><p class="gmsg">'+esc(x.msg)+'</p></li>'}).join('')+'</ul></div>':'<p class="small">아직 남긴 글이 없어요.</p>'):'')
 +'</section>';
}
function render(){
 var keep=document.activeElement&&document.activeElement.id;
 document.getElementById('root').innerHTML=
 '<header class="top"><div class="col"><p class="host">메드 투어 2027년 1월 커플 모임</p>'
 +'<h1><img class="logo" src="'+LOGO+'" width="760" height="598" alt="연차 2개 쓰고 어떡행"'+(view.anim?'':' style="animation:none"')+'></h1>'
 +'<p class="what">1월에 다카마쓰로 우동 먹으러 가요. 6~8명이 함께 가고, 날짜부터 정할게요.</p></div></header>'
 +'<main class="col">'
 +'<section aria-label="항공편">'+pass()+'</section>'
 +'<section><h2>날짜 후보</h2><p class="lede">가격은 1인 왕복 기준이에요. 11월 16일 스카이스캐너에서 검색한 최저가라 예매할 때 달라질 수 있어요.</p>'+options()+'</section>'
 +'<section><h2>가능한 날짜에 투표해 주세요</h2><p class="lede">되는 날짜는 모두 골라 주세요. 가장 많이 모이는 날로 정하고, 일정은 날짜가 정해지면 같이 짤게요.</p>'+voteForm()+'</section>'
 +guest()
 +'<footer>메드 투어가 만든 안내 페이지예요. 에어서울이나 여행사의 공식 안내가 아니에요.</footer>'
 +'</main>';
 view.anim=false;
 if(keep){var el=document.getElementById(keep);if(el)try{el.focus({preventScroll:true})}catch(e){}}
}
function readDraft(){
 var f=document.getElementById('vote');
 if(f){var s=f.querySelector('input[name=size]:checked');
  view.draft={name:document.getElementById('f-name').value.trim(),size:s?s.value:'2',
   plans:[].map.call(f.querySelectorAll('input[name=plans]:checked'),function(i){return i.value}),
   none:document.getElementById('f-none').checked,memo:document.getElementById('f-memo').value.trim()}}
 var g=document.getElementById('guest');
 if(g)view.gdraft={name:document.getElementById('g-name').value.trim(),msg:document.getElementById('g-msg').value.trim()};
}
function api(body){
 var ctl=('AbortController' in window)?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort()},15000);
 var opt=body?{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}:{};
 if(ctl)opt.signal=ctl.signal;
 return fetch(ENDPOINT,opt).then(function(res){return res.json()}).then(function(j){clearTimeout(t);if(!j||!j.ok){var e=new Error('server');e.user=j&&j.error;throw e}return j.data},function(e){clearTimeout(t);throw e});
}
function load(){
 view.load='loading';render();
 api().then(function(d){view.data=d;view.load='ready';readDraft();render()},function(){view.load='error';readDraft();render()});
}
function submitVote(){
 readDraft();var d=view.draft;
 if(!d.name){view.err=true;view.msg='이름을 적어 주세요.';render();return}
 if(!d.plans.length&&!d.none){view.err=true;view.msg='갈 수 있는 날짜를 고르거나 "이번엔 어려워요"를 골라 주세요.';render();return}
 if(d.plans.length&&d.none){view.err=true;view.msg='날짜를 골랐다면 "이번엔 어려워요"는 빼 주세요.';render();return}
 view.busy='vote';view.msg='';render();
 api({type:'vote',name:d.name,size:d.size,plans:d.none?[]:d.plans,memo:d.memo}).then(function(data){
  view.data=data;view.load='ready';view.busy='';view.err=false;view.msg='투표했어요. 고마워요!';
  view.draft={name:'',size:'2',plans:[],none:false,memo:''};render();
 },function(e){view.busy='';view.err=true;view.msg=(e&&e.user)||'투표하지 못했어요. 잠시 후 다시 눌러 주세요.';readDraft();render()});
}
function submitGuest(){
 readDraft();var d=view.gdraft;
 if(!d.name||!d.msg){view.gerr=true;view.gmsg='이름과 남길 말을 적어 주세요.';render();return}
 view.busy='guest';view.gmsg='';render();
 api({type:'guest',name:d.name,msg:d.msg}).then(function(data){
  view.data=data;view.load='ready';view.busy='';view.gerr=false;view.gmsg='남겼어요.';view.gdraft={name:'',msg:''};render();
 },function(e){view.busy='';view.gerr=true;view.gmsg=(e&&e.user)||'남기지 못했어요. 잠시 후 다시 눌러 주세요.';readDraft();render()});
}
document.addEventListener('submit',function(ev){ev.preventDefault();if(view.busy)return;if(ev.target.id==='vote')submitVote();else if(ev.target.id==='guest')submitGuest()});
render();
if(LIVE&&READY)load();
})();
</script>
</body>
</html>
